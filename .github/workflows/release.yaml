name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Build for Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o irmon-linux-amd64 ./cmd/irmon
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o irmon-agent-linux-amd64 ./cmd/irmon-agent

          # Build for Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o irmon-linux-arm64 ./cmd/irmon
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o irmon-agent-linux-arm64 ./cmd/irmon-agent

          # Create checksums
          sha256sum irmon-* irmon-agent-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## irmon ${{ steps.version.outputs.VERSION }}

            ### Binaries

            | Binary | Architecture | Description |
            |--------|--------------|-------------|
            | `irmon-linux-amd64` | Linux x86_64 | Monitor (runs on non-Iranian server) |
            | `irmon-linux-arm64` | Linux ARM64 | Monitor (runs on non-Iranian server) |
            | `irmon-agent-linux-amd64` | Linux x86_64 | Agent (runs on Iranian servers) |
            | `irmon-agent-linux-arm64` | Linux ARM64 | Agent (runs on Iranian servers) |

            ### Installation & Update

            Run the one-click installer (also works for updating to this version):

            **On Iranian servers (agent):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/ArchNets/irmon/master/install-agent.sh | sudo bash
            ```

            **On non-Iranian server (monitor):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/ArchNets/irmon/master/install.sh | sudo bash
            ```

            > **Tip:** To update, simply run the same install command again. It will download the latest version.
          files: |
            irmon-linux-amd64
            irmon-linux-arm64
            irmon-agent-linux-amd64
            irmon-agent-linux-arm64
            checksums.txt
          draft: false
          prerelease: false
